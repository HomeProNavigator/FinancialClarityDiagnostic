<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Introduction received</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f3f0e8;
        color: #1c1916;
        font-family: "Source Sans 3", "Source Sans Pro", system-ui, sans-serif;
      }
      main { max-width: 28rem; }
      .kicker {
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 0.7rem;
        color: #8a837b;
      }
      h1 {
        margin: 0.75rem 0 0;
        font-family: Georgia, "Iowan Old Style", serif;
        font-weight: 500;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }
      p { color: #6b6560; line-height: 1.55; }
      a {
        display: inline-flex;
        margin-top: 1.5rem;
        background: #1e3d34;
        color: #f3f0e8;
        text-decoration: none;
        padding: 0.85rem 1.25rem;
        border-radius: 12px;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <!--
      Netlify Forms detection. This static markup is scanned at deploy.
      Do not remove the form or change its name without updating /connect.
    -->
    <form
      name="visari-intro"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="visari-intro" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="company" />
      <textarea name="note"></textarea>
      <input name="placement" />
      <input name="ref" />
      <input name="score" />
      <input name="revenue" />
      <input name="industry" />
    </form>
    <main>
      <p class="kicker">Introduction</p>
      <h1>Received. Continue to Visari.</h1>
      <p>
        Your note is with the referring partner. Visari’s contact page is next —
        the referral tag is already on the link.
      </p>
      <a
        href="https://visarifinancial.com/contact?utm_source=financial-clarity&utm_medium=referral&utm_campaign=clarity-report&utm_term=kyle&ref=kyle"
        >Continue to Visari</a
      >
    </main>
  </body>
</html>
