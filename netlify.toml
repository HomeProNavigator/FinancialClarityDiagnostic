[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_AUTH_ENABLED = "false"

[dev]
  command = "npm run dev"
  port = 8080

[[redirects]]
  from = "https://financialclaritydiagnostic.netlify.app/*"
  to = "https://financialclaritydiagnostic.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
